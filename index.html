<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Simple Calculator</title>
</head>
<body>
    <main>
        <div class="calculator">
            <div class="screen-container">
                <span class="content" id="input">0</span>
            </div>

            <div class="button-container">
                    <button class="input-button" id="button7">7</button>
                    <button class="input-button" id="button8">8</button>
                    <button class="input-button" id="button9">9</button>
                    <button class="input-button" id="button+">+</button>

                    <button class="input-button" id="button4">4</button>
                    <button class="input-button" id="button5">5</button>
                    <button class="input-button" id="button6">6</button>
                    <button class="input-button" id="button-">-</button>

                    <button class="input-button" id="button1">1</button>
                    <button class="input-button" id="button2">2</button>
                    <button class="input-button" id="button3">3</button>
                    <button class="input-button" id="button*">*</button>

                    <button class="input-button" id="buttonClear">AC</button>
                    <button class="input-button" id="button0">0</button>
                    <button class="input-button" id="button=">=</button>
                    <button class="input-button" id="button/">/</button>
            </div>
        </div>
    </main>
    <script src="calculator.js"></script>
</body>
</html>
